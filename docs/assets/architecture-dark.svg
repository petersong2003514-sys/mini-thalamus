<svg xmlns="http://www.w3.org/2000/svg" width="860" height="884" viewBox="0 0 860 884" role="img" aria-label="Mini Thalamus architecture. A client talks to a FastAPI server. Requests pass through a router cascade of three stages — rules, then semantic, then LLM — where a stage abstains rather than guess. Then an orchestrator plans, validates and executes a DAG, dispatching to one of fourteen specialist agents. All of them share tiered memory, tool registry, skills, agent registry, token budget and circuit breakers.">
  <style>
    .f  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl{ font-size: 15px;   font-weight: 600; fill: #e6edf3; }
    .sub{ font-size: 12.5px; font-weight: 400; fill: #8b949e; }
    .gt { font-size: 13px;   font-weight: 600; fill: #e6edf3; }
    .ga { font-size: 13px;   font-weight: 600; fill: #c4b5fd; }
    .ct { font-size: 13.5px; font-weight: 600; fill: #e6edf3; }
    .cs { font-size: 11px;   font-weight: 400; fill: #8b949e; }
    .pl { font-size: 12px;   font-weight: 500; fill: #e6edf3; }
    .fn { font-size: 11px;   font-weight: 400; fill: #a78bfa; }
    .arw{ stroke: #6e7681; stroke-width: 1.6; fill: none; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="860" height="884" fill="#0d1117"/>

  <!-- ── Client ─────────────────────────────────────────────── -->
  <rect x="310" y="24" width="280" height="54" rx="12" fill="#161b22" stroke="#30363d"/>
  <text class="f ttl" x="450" y="48" text-anchor="middle">Client</text>
  <text class="f sub" x="450" y="66" text-anchor="middle">React SPA &#183; SSE stream</text>

  <line class="arw" x1="450" y1="78" x2="450" y2="103" marker-end="url(#ah)"/>

  <!-- ── Server ─────────────────────────────────────────────── -->
  <rect x="300" y="110" width="300" height="58" rx="12" fill="#161b22" stroke="#30363d"/>
  <text class="f ttl" x="450" y="134" text-anchor="middle">FastAPI server</text>
  <text class="f sub" x="450" y="155" text-anchor="middle">/api/chat (SSE) &#183; static SPA</text>

  <line class="arw" x1="450" y1="168" x2="450" y2="193" marker-end="url(#ah)"/>

  <!-- ── Router cascade ─────────────────────────────────────── -->
  <rect x="120" y="200" width="660" height="174" rx="16" fill="#171a33" stroke="#2f2a5e"/>
  <text class="f ga" x="450" y="232" text-anchor="middle">Router &#183; three-stage cascade</text>

  <rect x="168" y="250" width="176" height="96" rx="12" fill="#0d1117" stroke="#2f2a5e"/>
  <text class="f ct" x="256" y="284" text-anchor="middle">1 &#183; Rules</text>
  <text class="f cs" x="256" y="310" text-anchor="middle">regex + keywords</text>
  <text class="f cs" x="256" y="330" text-anchor="middle">fires, no LLM call</text>

  <rect x="362" y="250" width="176" height="96" rx="12" fill="#0d1117" stroke="#2f2a5e"/>
  <text class="f ct" x="450" y="284" text-anchor="middle">2 &#183; Semantic</text>
  <text class="f cs" x="450" y="310" text-anchor="middle">embedding + BM25</text>
  <text class="f cs" x="450" y="330" text-anchor="middle">needs score + margin</text>

  <rect x="556" y="250" width="176" height="96" rx="12" fill="#0d1117" stroke="#2f2a5e"/>
  <text class="f ct" x="644" y="284" text-anchor="middle">3 &#183; LLM</text>
  <text class="f cs" x="644" y="310" text-anchor="middle">shortlist in, JSON out</text>
  <text class="f cs" x="644" y="330" text-anchor="middle">up to 3 attempts</text>

  <text class="f fn" x="450" y="366" text-anchor="middle">a stage abstains rather than guess &#8212; unclear intents escalate to the LLM</text>

  <line class="arw" x1="450" y1="374" x2="450" y2="399" marker-end="url(#ah)"/>

  <!-- ── Orchestrator ───────────────────────────────────────── -->
  <rect x="250" y="406" width="400" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
  <text class="f ttl" x="450" y="432" text-anchor="middle">Orchestrator</text>
  <text class="f sub" x="450" y="454" text-anchor="middle">plan DAG &#9656; validate &#9656; execute</text>

  <line class="arw" x1="450" y1="470" x2="450" y2="495" marker-end="url(#ah)"/>

  <!-- ── Agents ─────────────────────────────────────────────── -->
  <rect x="120" y="502" width="660" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
  <text class="f gt" x="450" y="532" text-anchor="middle">14 specialist agents &#183; hot-swappable at runtime</text>

  <rect x="274" y="550" width="58" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="303" y="570" text-anchor="middle">nl2sql</text>
  <rect x="342" y="550" width="44" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="364" y="570" text-anchor="middle">rag</text>
  <rect x="396" y="550" width="52" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="422" y="570" text-anchor="middle">code</text>
  <rect x="458" y="550" width="75" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="496" y="570" text-anchor="middle">docparse</text>
  <rect x="543" y="550" width="83" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="585" y="570" text-anchor="middle">websearch</text>

  <rect x="221" y="592" width="71" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="257" y="612" text-anchor="middle">url fetch</text>
  <rect x="302" y="592" width="58" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="331" y="612" text-anchor="middle">vision</text>
  <rect x="370" y="592" width="102" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="421" y="612" text-anchor="middle">deep research</text>
  <rect x="482" y="592" width="92" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="528" y="612" text-anchor="middle">data analyst</text>
  <rect x="584" y="592" width="95" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="632" y="612" text-anchor="middle">report writer</text>

  <rect x="304" y="634" width="75" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="342" y="654" text-anchor="middle">api caller</text>
  <rect x="389" y="634" width="70" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="424" y="654" text-anchor="middle">browser</text>
  <rect x="469" y="634" width="51" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="495" y="654" text-anchor="middle">shell</text>
  <rect x="530" y="634" width="67" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="564" y="654" text-anchor="middle">general</text>

  <line class="arw" x1="450" y1="688" x2="450" y2="713" marker-end="url(#ah)"/>

  <!-- ── Shared infrastructure ──────────────────────────────── -->
  <rect x="120" y="720" width="660" height="140" rx="16" fill="#161b22" stroke="#30363d"/>
  <text class="f gt" x="450" y="750" text-anchor="middle">Shared infrastructure</text>

  <rect x="312" y="768" width="109" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="367" y="788" text-anchor="middle">Tiered memory</text>
  <rect x="431" y="768" width="94" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="478" y="788" text-anchor="middle">Tool registry</text>
  <rect x="535" y="768" width="53" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="562" y="788" text-anchor="middle">Skills</text>

  <rect x="282" y="810" width="104" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="334" y="830" text-anchor="middle">Agent registry</text>
  <rect x="396" y="810" width="101" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="447" y="830" text-anchor="middle">Token budget</text>
  <rect x="507" y="810" width="111" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="f pl" x="563" y="830" text-anchor="middle">Circuit breakers</text>
</svg>
