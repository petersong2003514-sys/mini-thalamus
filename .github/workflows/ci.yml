name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# "293 tests pass" is a claim in the README. This is what makes it a fact.
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor of the advertised range: catches syntax and stdlib API
          # that only exist on newer interpreters.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          # Development happens on Windows, and some paths are
          # platform-sensitive (file locks, DLL load order, encoding).
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Core dependencies only. The optional extras (torch-backed embeddings,
      # OCR, headless Chromium) are deliberately absent: the suite has to pass
      # on a minimal install, because that is what the README tells people to do.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check that every module imports
        # The unit tests cover a fraction of the tree; this covers the rest.
        run: python scripts/check_imports.py

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
